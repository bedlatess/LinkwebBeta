# ╔══════════════════════════════════════════════════════════════════╗
# ║  LinkWeb — Docker Compose Production Configuration               ║
# ║                                                                  ║
# ║  Quick start:                                                    ║
# ║    1. cp .env.example .env                                       ║
# ║    2. Fill in OAuth credentials + NEXTAUTH_SECRET                ║
# ║    3. docker compose up -d --build                               ║
# ║    4. Visit http://localhost:2222                                ║
# ╚══════════════════════════════════════════════════════════════════╝

services:
  linkweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkweb
    ports:
      - "${PORT:-2222}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/linkweb.db
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:2222}
    volumes:
      # Persist SQLite database and uploaded assets (/app/data/uploads)
      - linkweb-data:/app/data
    restart: unless-stopped
    # Security: no new privileges, read-only root filesystem (except volumes)
    security_opt:
      - no-new-privileges:true
    read_only: true

volumes:
  linkweb-data:
    driver: local
